[package]
name = "metadata-connect-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Bounded audio metadata extraction through caller-owned range readers"
publish = false
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
