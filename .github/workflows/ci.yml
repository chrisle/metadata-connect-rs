name: Rust and source parity
on: [push, pull_request]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
  original-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts --ignore-scripts
      - run: git clone --no-checkout https://github.com/chrisle/metadata-connect.git scripts/original
      - run: git -C scripts/original checkout c2ae262650a7bbe7af5fb5222a6ab6b882ecf865
      - run: node scripts/oracle.mjs --check
        env:
          METADATA_SOURCE: scripts/original
